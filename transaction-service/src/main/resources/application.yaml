server:
  port: 8082

spring:
  application:
    name: transaction-service

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka

services:
  transaction-service:
    ports:
      - "8082:8082"
