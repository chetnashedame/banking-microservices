services:

  eureka-server:
    build: ./service-registry
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
       - SPRING_PROFILES_ACTIVE=docker

  account-service:
    build: ./account-service
    container_name: account-service
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
       - SPRING_PROFILES_ACTIVE=docker

  transaction-service:
    build: ./transaction-service
    container_name: transaction-service
    ports:
    - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
       - SPRING_PROFILES_ACTIVE=docker

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
    environment:
       - SPRING_PROFILES_ACTIVE=docker